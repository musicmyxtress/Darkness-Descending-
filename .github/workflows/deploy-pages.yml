# Deploy the static site to GitHub Pages.
#
# This is a zero-build site: the repository root is uploaded as-is and
# served by Pages. Runs on every push to main, or manually from the
# Actions tab.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; don't cancel in-flight production
# deploys, but skip queued ones in favor of the latest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically if it isn't enabled yet.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Zero-build static site: publish the repository root.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
